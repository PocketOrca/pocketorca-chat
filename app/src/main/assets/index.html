<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketOrca-Chat</title>
<style>
:root{--bg:#0e1116;--bg2:#161b22;--bg3:#1f2630;--fg:#e6edf3;--dim:#8b949e;--acc:#4da3ff;--ok:#3fb950;--err:#f85149;--me:#1f6feb;--fs:15px;--fs-dim:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:var(--fs)/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid #232a33;flex:none}
header h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}
button{background:var(--bg3);color:var(--fg);border:1px solid #2d3540;border-radius:8px;padding:7px 12px;font-size:14px}
button:active{opacity:.7}
button.primary{background:var(--me);border-color:var(--me)}
button:disabled{opacity:.4}
/* contacts list view */
#contactsView{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#contactsView header{flex:none}
#contactList{flex:1;overflow-y:auto}
.crow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1b2129;cursor:pointer}
.crow:active{background:var(--bg2)}
.crow.active{background:var(--bg2)}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.cdot.ok{background:var(--ok)}.cdot.err{background:var(--err)}
.cmain{flex:1;min-width:0}
.cname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curl{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:14px}
/* chat view */
#chatView{display:none;flex-direction:column;flex:1;min-height:0}
#view{flex:1;overflow-y:auto;padding:12px 14px}
.msg{max-width:86%;margin:6px 0;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word;font-size:var(--fs)}
.msg.user{background:var(--me);margin-left:auto;border-bottom-right-radius:4px}
.msg.bot{background:var(--bg2);border:1px solid #232a33;border-bottom-left-radius:4px}
.msg.sys{background:transparent;color:var(--dim);font-size:var(--fs-dim);text-align:center;margin:0 auto;max-width:100%}
/* vc21: data-URL image bubbles */
.msg.bot.img,.msg .msg-img>img{padding:0;background:transparent;border:none}
.msg img{display:block;max-width:100%;max-height:60vh;border-radius:12px;cursor:pointer}
.imgcap{font-size:var(--fs-dim);color:var(--dim);padding:4px 4px 2px;white-space:pre-wrap}
/* vc11: relay quote block (delegation relay, PLAN §4) */
.msg.relay{background:var(--bg2);border:1px solid #2d3540;border-left:3px solid var(--acc);border-radius:10px;padding:8px 12px}
.msg.relay .relay-head{font-size:12px;color:var(--acc);margin-bottom:4px}
.msg.relay .relay-body{font-size:var(--fs);white-space:pre-wrap;word-break:break-word}
.relay-cancel{margin-top:6px;font-size:12px;padding:4px 10px}
.cursor{display:inline-block;width:8px;height:15px;background:var(--acc);vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.approval{background:#2d2300;border:1px solid #9e6a03;border-radius:12px;padding:10px 12px;margin:8px 0;max-width:92%}
.approval .cmd{font-family:monospace;font-size:13px;background:#000;border-radius:6px;padding:6px;margin:6px 0;word-break:break-all}
.approval .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.approval button{flex:1}
.steer{display:flex;gap:8px;padding:6px 10px}
.steer input{flex:1;background:#1a1a1a;border:1px solid #444;border-radius:10px;color:#eee;padding:8px 10px;font-size:14px}
.steer button{padding:0 14px}
#composer{display:flex;gap:8px;padding:10px 12px;background:var(--bg2);border-top:1px solid #232a33;flex:none;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#input{flex:1;background:var(--bg3);border:1px solid #2d3540;border-radius:20px;padding:9px 14px;color:var(--fg);font-size:15px;outline:none;resize:none;white-space:pre-wrap;overflow-wrap:break-word;max-height:40vh;overflow-y:auto;font-family:inherit;line-height:1.35}
/* ---- vc18: transient tool/activity line (one at a time, cleared at turn end) ---- */
#toolLine{display:none;padding:6px 14px 0;font-size:var(--fs-dim);color:var(--dim);background:var(--bg);border-top:1px solid #1b2129;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toolLine.show{display:block}
/* ---- vc22: live context meter (under chat header) ---- */
#ctxBar{display:none;position:relative;height:20px;background:#12161c;border-bottom:1px solid #1b2129;flex:none;overflow:hidden}
#ctxFill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(63,185,80,.22);transition:width .35s ease}
#ctxFill.warm{background:rgba(210,153,34,.28)}
#ctxFill.hot{background:rgba(248,81,73,.32)}
#ctxLabel{position:relative;line-height:20px;padding:0 12px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- vc22: history jump banner + hit highlight ---- */
#histBanner{display:none;align-items:center;gap:8px;padding:6px 12px;background:#1f2630;border-bottom:1px solid #2d3540;font-size:12px;color:var(--acc);flex:none}
#histBanner.show{display:flex}
#histBanner span{flex:1}
#histBanner button{padding:3px 10px;font-size:12px}
.msg.hit{outline:2px solid var(--acc);outline-offset:2px;animation:hitflash 1.6s ease-out 1}
@keyframes hitflash{0%{background:#1c3d63}}
/* ---- vc22: search sheet ---- */
.sheet.tall{height:82vh;display:flex;flex-direction:column}
.sheet .srlist{flex:1;overflow-y:auto;margin-top:10px;border-top:1px solid #262d36}
.srrow{padding:9px 2px;border-bottom:1px solid #1b2129;cursor:pointer}
.srrow:active{background:var(--bg3)}
.srhead{display:flex;gap:8px;font-size:11px;color:var(--dim);margin-bottom:3px}
.srhead .who{color:var(--acc)}
.srtext{font-size:13px;color:var(--fg);word-break:break-word}
.srtext b{color:#ffd166;font-weight:600}
/* ---- vc15: action sheet (long-press on contact) + in-page confirm ---- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
.mask.show{display:flex}
.mask.center{align-items:center;justify-content:center;padding:0 28px}
.actlist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.actlist button{padding:13px;font-size:15px;border-radius:10px}
button.danger{color:var(--err);border-color:#5f2a2a}
.csub{font-size:var(--fs-dim);color:var(--dim);margin-top:2px}
.card{width:100%;background:var(--bg2);border-radius:14px;padding:18px 16px;border:1px solid #232a33}
.card h2{font-size:15px;margin-bottom:10px}
.card p{font-size:13px;color:var(--dim);line-height:1.5}
.sheet{width:100%;background:var(--bg2);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:15px;margin-bottom:12px}
.sheet label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.sheet input{width:100%;background:var(--bg3);border:1px solid #2d3540;border-radius:8px;padding:9px 12px;color:var(--fg);font-size:14px;outline:none}
.sheet .row{display:flex;gap:10px;margin-top:16px}
.sheet .row button{flex:1}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#333c48;color:var(--fg);padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:20;max-width:80%}
.hint{color:var(--dim);font-size:12px;margin-top:8px}
.ct-toggle-row{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;margin-top:8px}
.ct-toggle-row input{width:auto}
.statusline{font-size:var(--fs-dim);color:var(--dim);text-align:center;margin:4px 0}
</style>
</head>
<body>
<div id="app">
  <!-- contacts list view -->
  <div id="contactsView">
    <header>
      <h1>联系人</h1>
      <button id="btnSearch" style="padding:5px 10px">🔍</button>
      <button id="btnSys" style="padding:5px 10px">⚙</button>
      <button id="btnAdd" class="primary" style="padding:5px 12px">＋ 添加</button>
    </header>
    <div id="contactList"></div>
    <div class="statusline">长按联系人：编辑 / 删除</div>
  </div>
  <!-- chat view -->
  <div id="chatView">
    <header>
      <button id="btnBack" style="padding:5px 10px">‹ 联系人</button>
      <div class="dot" id="connDot"></div>
      <h1 id="title">PocketOrca-Chat</h1>
      <button id="btnEditCur" style="padding:5px 10px">编辑</button>
      <button id="btnHealth" style="padding:5px 10px">测活</button>
    </header>
    <div id="ctxBar"><div id="ctxFill"></div><div id="ctxLabel"></div></div>
    <div id="histBanner"><span id="histText"></span><button id="histBack">回到最新</button></div>
    <div id="view"></div>
    <div id="toolLine"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="消息…（/help 查看命令）" autocomplete="off"></textarea>
      <button id="btnSend" class="primary">发送</button>
      <button id="btnStop" style="display:none">停止</button>
    </div>
  </div>
</div>

<div class="mask" id="ctMask"><div class="sheet">
  <h2 id="sheetTitle">添加联系人</h2>
  <label>名称（留空自动取主机名）</label>
  <input id="ctName" placeholder="如：家里 8T">
  <label>地址（IP 或主机名，可带 http://，省略默认 http）</label>
  <input id="ctHost" placeholder="如 192.168.1.100" inputmode="url">
  <label>端口</label>
  <input id="ctPort" placeholder="8642" inputmode="numeric">
  <label>API Key（该端点的 API_SERVER_KEY）</label>
  <input id="ctToken" type="password" placeholder="Bearer token">
  <label class="ct-toggle-row"><input type="checkbox" id="ctWanToggle"> 添加公网地址（Tailscale，可选）</label>
  <div id="ctWanBlock" style="display:none">
    <label>公网地址（IP 或主机名，可带 http://，端口同上可省略）</label>
    <input id="ctWanHost" placeholder="如 100.x.y.z" inputmode="url">
    <label>公网端口（留空同局域网端口）</label>
    <input id="ctWanPort" placeholder="8642" inputmode="numeric">
  </div>
  <div class="hint">Key 用 Android Keystore（AES/GCM）加密存本地。</div>
  <div class="row"><button id="btnCtCancel">取消</button><button id="ctSave" class="primary">保存</button></div>
</div></div>

<div id="toast"></div>

<!-- vc15: long-press action sheet -->
<div class="mask" id="actMask"><div class="sheet">
  <h2 id="actTitle">联系人</h2>
  <div class="csub" id="actSub"></div>
  <div class="actlist">
    <button id="actEdit">编辑</button>
    <button id="actClear">清空聊天记录</button>
    <button id="actDel" class="danger">删除联系人</button>
    <button id="actCancel">取消</button>
  </div>
</div></div>

<!-- vc15: in-page confirm (WebView has no WebChromeClient → window.confirm() silently returns false) -->
<div class="mask center" id="cfMask"><div class="card">
  <h2 id="cfTitle">确认</h2>
  <p id="cfDesc"></p>
  <div class="row" style="display:flex;gap:10px;margin-top:16px">
    <button id="cfNo" style="flex:1">取消</button>
    <button id="cfYes" class="primary danger" style="flex:1">确定</button>
  </div>
</div></div>

<!-- vc26: settings (version + font size) + local data panel -->
<div class="mask" id="sysMask"><div class="sheet">
  <h2>设置</h2>
  <p id="sysVer" class="csub">版本读取中…</p>
  <label>字体大小（当前 <span id="fsLabel">15</span>px）</label>
  <div class="row" style="margin-top:6px">
    <button id="fsMinus" style="flex:1">A−</button>
    <button id="fsReset" style="flex:1">默认</button>
    <button id="fsPlus" style="flex:1">A＋</button>
  </div>
  <!-- vc29: poll interval (four fixed choices, screen-on/off same档) -->
  <label style="margin-top:18px">新消息轮询间隔（当前 <span id="pollLabel">60</span> 秒）</label>
  <p class="csub" style="margin:2px 0 6px">间隔越短新消息提醒越及时，熄屏耗电略增</p>
  <div class="row" style="margin-top:6px">
    <button class="pollOpt" data-ms="30000" style="flex:1">30秒</button>
    <button class="pollOpt" data-ms="60000" style="flex:1">1分</button>
    <button class="pollOpt" data-ms="180000" style="flex:1">3分</button>
    <button class="pollOpt" data-ms="300000" style="flex:1">5分</button>
  </div>
  <h2 style="margin-top:18px">本地数据</h2>
  <p id="sysStat" class="csub" style="line-height:1.7">读取中…</p>
  <div class="actlist">
    <button id="sysWipe" class="danger">清空全部本地数据</button>
    <button id="sysClose">关闭</button>
  </div>
</div></div>
<!-- vc22: history search across local transcripts -->
<div class="mask" id="searchMask"><div class="sheet tall">
  <h2>搜索聊天记录</h2>
  <input id="searchInput" placeholder="关键词（跨全部联系人）" autocomplete="off">
  <div class="csub" id="searchInfo"></div>
  <div class="srlist" id="searchList"></div>
  <div class="row"><button id="searchClose">关闭</button></div>
</div></div>
<!-- vc33 model picker sheet removed in vc34: /model command is the only control -->

<script src="app.js"></script>
</body>
</html>
